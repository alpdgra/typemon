name: Diagnose and fix Pages source

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Report current Pages config
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "--- Pages config BEFORE ---"
          gh api "repos/$REPO/pages" || echo "(pages not enabled)"

      - name: Fetch the live site
        run: |
          echo "--- HTTP status ---"
          curl -sS -o page.html -w '%{http_code} (final: %{url_effective})\n' \
            -L https://alpdgra.github.io/typemon/ || true
          echo "--- title ---"
          grep -o '<title>[^<]*</title>' page.html || echo "(no title found)"
          echo "--- name references ---"
          echo "Typebound: $(grep -ci typebound page.html || true)"
          echo "Typemon:   $(grep -ci typemon page.html || true)"
          echo "--- referenced assets ---"
          grep -oE '(src|href)="[^"]*"' page.html | head -10 || true

      - name: Force Pages to build from Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X PUT "repos/$REPO/pages" -f build_type=workflow \
            && echo "build_type set to workflow" \
            || echo "PUT failed"
          echo "--- Pages config AFTER ---"
          gh api "repos/$REPO/pages" || true
