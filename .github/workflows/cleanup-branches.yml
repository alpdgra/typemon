name: One-shot branch cleanup

on:
  push:
    branches: [claude/api-keys-repo-scan-jmxg6t]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for branch in zz-perm-test agent/publish-github-pages; do
            echo "Deleting $branch"
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" \
              && echo "  deleted" \
              || echo "  failed (may already be gone)"
          done
          echo "Remaining branches:"
          gh api "repos/$REPO/branches" --jq '.[].name'
